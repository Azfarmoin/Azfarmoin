<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Conceptual artwork for Aura: a clay sphere at the center of orbiting rings and product nodes.">
  <title>Artifact 02: Aura (conceptual artwork)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#08090D"/><stop offset="1" stop-color="#1A0F45"/></linearGradient>
    <radialGradient id="core" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#EFE6FF"/><stop offset=".45" stop-color="#8B5CF6"/><stop offset="1" stop-color="#34188A"/></radialGradient>
    <radialGradient id="sm" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#EAF0FF"/><stop offset=".5" stop-color="#4263FF"/><stop offset="1" stop-color="#16227A"/></radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".5"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <style>.t{font-family:'Arial Black',Impact,Arial,sans-serif;font-weight:900}.m{font-family:'Courier New',Consolas,monospace;font-weight:700}
  @keyframes spin{to{transform:rotate(360deg)}}.o{transform-origin:600px 260px;animation:spin 60s linear infinite}</style>
  <rect width="900" height="520" fill="url(#bg)"/>
  <circle cx="600" cy="260" r="230" fill="url(#halo)"/>
  <g class="o" fill="none" stroke="#9DB8FF" stroke-opacity=".55">
    <ellipse cx="600" cy="260" rx="220" ry="70" transform="rotate(-20 600 260)"/>
    <ellipse cx="600" cy="260" rx="170" ry="170" stroke-dasharray="3 9"/>
    <ellipse cx="600" cy="260" rx="250" ry="110" transform="rotate(30 600 260)"/>
    <g fill="#fff" stroke="none"><circle cx="400" cy="200" r="6"/><circle cx="790" cy="330" r="6"/><circle cx="560" cy="90" r="5"/><circle cx="640" cy="430" r="5"/></g>
  </g>
  <g filter="url(#soft)">
    <circle cx="600" cy="260" r="78" fill="url(#core)"/>
    <ellipse cx="575" cy="232" rx="26" ry="13" fill="#fff" fill-opacity=".5" transform="rotate(-30 575 232)"/>
    <circle cx="470" cy="360" r="28" fill="url(#sm)"/>
    <circle cx="745" cy="170" r="22" fill="url(#sm)"/>
    <rect x="690" y="340" width="60" height="44" rx="16" fill="url(#sm)"/>
  </g>
  <text x="36" y="230" class="t" font-size="190" fill="none" stroke="#8B5CF6" stroke-opacity=".6" stroke-width="2.5">02</text>
  <g class="m" fill="#B7CAFF" letter-spacing="2">
    <text x="40" y="52" font-size="18" fill="#fff">ARTIFACT 02</text>
    <text x="40" y="420" font-size="22" fill="#fff">AURA</text>
    <text x="40" y="450" font-size="16" fill-opacity=".8">E-COMMERCE EXPERIMENT</text>
    <text x="40" y="490" font-size="13" fill-opacity=".55">CONCEPTUAL ARTWORK. NOT A SCREENSHOT.</text>
  </g>
</svg>
