<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Conceptual artwork for CountryGuesser: a wireframe globe with a highlighted target marker.">
  <title>Artifact 03: CountryGuesser (conceptual artwork)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090D"/><stop offset="1" stop-color="#0A1F3D"/></linearGradient>
    <radialGradient id="globe" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#4263FF" stop-opacity=".55"/><stop offset="1" stop-color="#16227A" stop-opacity=".25"/></radialGradient>
    <radialGradient id="pin" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#FFF"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#34188A"/></radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <style>.t{font-family:'Arial Black',Impact,Arial,sans-serif;font-weight:900}.m{font-family:'Courier New',Consolas,monospace;font-weight:700}
  @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}.mer{animation:drift 9s ease-in-out infinite}
  @keyframes ping{0%{r:14;opacity:.9}100%{r:44;opacity:0}}.ping{animation:ping 2.8s ease-out infinite}</style>
  <rect width="900" height="520" fill="url(#bg)"/>
  <g filter="url(#soft)"><circle cx="610" cy="260" r="200" fill="url(#globe)" stroke="#B7CAFF" stroke-opacity=".7" stroke-width="1.5"/></g>
  <g fill="none" stroke="#9DB8FF" stroke-opacity=".5">
    <ellipse cx="610" cy="260" rx="200" ry="52"/><ellipse cx="610" cy="260" rx="200" ry="110"/><ellipse cx="610" cy="260" rx="200" ry="170"/>
    <line x1="410" y1="260" x2="810" y2="260"/>
    <g class="mer"><ellipse cx="610" cy="260" rx="70" ry="200"/><ellipse cx="610" cy="260" rx="140" ry="200"/><line x1="610" y1="60" x2="610" y2="460"/></g>
  </g>
  <circle class="ping" cx="680" cy="196" r="14" fill="none" stroke="#B49CFF" stroke-width="2"/>
  <circle cx="680" cy="196" r="14" fill="url(#pin)" filter="url(#soft)"/>
  <line x1="680" y1="196" x2="860" y2="96" stroke="#B7CAFF" stroke-opacity=".6"/>
  <text x="866" y="88" class="m" font-size="14" fill="#B7CAFF" text-anchor="end" letter-spacing="2">TARGET ?</text>
  <text x="36" y="230" class="t" font-size="190" fill="none" stroke="#6E90FF" stroke-opacity=".6" stroke-width="2.5">03</text>
  <g class="m" fill="#B7CAFF" letter-spacing="2">
    <text x="40" y="52" font-size="18" fill="#fff">ARTIFACT 03</text>
    <text x="40" y="420" font-size="22" fill="#fff">COUNTRYGUESSER</text>
    <text x="40" y="450" font-size="16" fill-opacity=".8">JAVAFX GEOGRAPHY GAME</text>
    <text x="40" y="490" font-size="13" fill-opacity=".55">CONCEPTUAL ARTWORK. NOT A SCREENSHOT.</text>
  </g>
</svg>
