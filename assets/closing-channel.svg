<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="Closing scene: concentric signal rings around a clay sphere with the words OPEN CHANNEL.">
  <title>05 Connection: open channel</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090D"/><stop offset="1" stop-color="#101321"/></linearGradient>
    <radialGradient id="core" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#EAF0FF"/><stop offset=".45" stop-color="#4263FF"/><stop offset="1" stop-color="#16227A"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#4263FF" stop-opacity=".5"/><stop offset="1" stop-color="#4263FF" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".55"/></filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
  </defs>
  <style>.t{font-family:'Arial Black',Impact,Arial,sans-serif;font-weight:900}.m{font-family:'Courier New',Consolas,monospace;font-weight:700}
  @keyframes ring{0%{r:70;opacity:.8}100%{r:360;opacity:0}}.r1{animation:ring 6s ease-out infinite}.r2{animation:ring 6s ease-out 2s infinite}.r3{animation:ring 6s ease-out 4s infinite}</style>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>
  <ellipse cx="1180" cy="210" rx="360" ry="260" fill="url(#glow)"/>
  <g fill="none" stroke="#9DB8FF" stroke-width="1.5">
    <circle class="r1" cx="1180" cy="210" r="70"/><circle class="r2" cx="1180" cy="210" r="70"/><circle class="r3" cx="1180" cy="210" r="70"/>
    <circle cx="1180" cy="210" r="120" stroke-opacity=".35" stroke-dasharray="3 9"/><circle cx="1180" cy="210" r="190" stroke-opacity=".25"/>
  </g>
  <g filter="url(#soft)"><circle cx="1180" cy="210" r="62" fill="url(#core)"/><ellipse cx="1160" cy="188" rx="20" ry="10" fill="#fff" fill-opacity=".5" transform="rotate(-30 1160 188)"/></g>
  <g class="m" fill="#B7CAFF" letter-spacing="3">
    <text x="60" y="76" font-size="20" fill="#fff">05 / CONNECTION</text>
    <text x="60" y="380" font-size="15" fill-opacity=".65">KHI / PK  ·  24.8607° N / 67.0011° E</text>
  </g>
  <text x="56" y="210" class="t" font-size="104" fill="#fff">OPEN</text>
  <text x="56" y="316" class="t" font-size="104" fill="none" stroke="#6E90FF" stroke-width="2.5">CHANNEL</text>
</svg>
