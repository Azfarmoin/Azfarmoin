<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Original stylized 3D-style character: a young man with a swept dark quiff in a black technical jacket and cargo trousers, relaxed three-quarter pose, cobalt and ultraviolet rim light.">
<title>Azfar 3D character (original fictional persona, not a real likeness)</title>
<defs>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6B38A"/><stop offset=".55" stop-color="#C58A62"/><stop offset="1" stop-color="#8E5A3E"/></linearGradient>
  <linearGradient id="skinN" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9A6244"/><stop offset="1" stop-color="#6E4129"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B2F45"/><stop offset=".5" stop-color="#10121C"/><stop offset="1" stop-color="#05060A"/></linearGradient>
  <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2F47"/><stop offset=".45" stop-color="#141728"/><stop offset="1" stop-color="#07080E"/></linearGradient>
  <linearGradient id="jacketSl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#252A40"/><stop offset=".6" stop-color="#10131F"/><stop offset="1" stop-color="#07080E"/></linearGradient>
  <linearGradient id="pants" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#232842"/><stop offset=".5" stop-color="#11131F"/><stop offset="1" stop-color="#06070C"/></linearGradient>
  <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3350"/><stop offset="1" stop-color="#0A0B12"/></linearGradient>
  <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B9C0D8"/></linearGradient>
  <radialGradient id="cheek" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F2C29C" stop-opacity=".75"/><stop offset="1" stop-color="#F2C29C" stop-opacity="0"/></radialGradient>
  <radialGradient id="eyeW" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9D3CC"/></radialGradient>
  <filter id="glowB" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="3.2"/></filter>
  <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="clayShadow" x="-20%" y="-10%" width="140%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
