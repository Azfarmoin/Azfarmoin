<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Conceptual artwork for AttendX: a field of attendance dots with a rising bar series and a weighted grade curve.">
  <title>Artifact 01: AttendX (conceptual artwork)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090D"/><stop offset="1" stop-color="#101321"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FA2FF"/><stop offset="1" stop-color="#4263FF"/></linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="18" cy="18" r="5" fill="#4263FF" fill-opacity=".55"/></pattern>
    <pattern id="gaps" width="108" height="72" patternUnits="userSpaceOnUse"><circle cx="54" cy="36" r="6" fill="#101321"/><circle cx="90" cy="0" r="6" fill="#101321"/><circle cx="18" cy="72" r="6" fill="#101321"/></pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <style>.t{font-family:'Arial Black',Impact,Arial,sans-serif;font-weight:900}.m{font-family:'Courier New',Consolas,monospace;font-weight:700}
  @keyframes rise{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.94)}}.b{transform-box:fill-box;transform-origin:bottom;animation:rise 6s ease-in-out infinite}</style>
  <rect width="900" height="520" fill="url(#bg)"/>
  <rect x="330" y="60" width="540" height="324" fill="url(#dots)"/>
  <rect x="330" y="60" width="540" height="324" fill="url(#gaps)"/>
  <rect x="330" y="60" width="540" height="324" fill="none" stroke="#9DB8FF" stroke-opacity=".5"/>
  <g filter="url(#soft)">
    <rect class="b" x="360" y="300" width="44" height="130" rx="10" fill="url(#bar)"/>
    <rect class="b" x="424" y="270" width="44" height="160" rx="10" fill="url(#bar)"/>
    <rect class="b" x="488" y="230" width="44" height="200" rx="10" fill="url(#bar)"/>
    <rect class="b" x="552" y="250" width="44" height="180" rx="10" fill="url(#bar)"/>
    <rect class="b" x="616" y="190" width="44" height="240" rx="10" fill="url(#bar)"/>
    <rect class="b" x="680" y="160" width="44" height="270" rx="10" fill="url(#bar)"/>
  </g>
  <path d="M340 400 C 470 330, 560 360, 650 230 S 800 120, 860 100" fill="none" stroke="#B49CFF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="860" cy="100" r="11" fill="#fff"/>
  <text x="36" y="230" class="t" font-size="190" fill="none" stroke="#6E90FF" stroke-opacity=".6" stroke-width="2.5">01</text>
  <g class="m" fill="#B7CAFF" letter-spacing="2">
    <text x="40" y="52" font-size="18" fill="#fff">ARTIFACT 01</text>
    <text x="40" y="420" font-size="22" fill="#fff">ATTENDX</text>
    <text x="40" y="450" font-size="16" fill-opacity=".8">ATTENDANCE + GRADING</text>
    <text x="40" y="490" font-size="13" fill-opacity=".55">CONCEPTUAL ARTWORK. NOT A SCREENSHOT.</text>
  </g>
</svg>
